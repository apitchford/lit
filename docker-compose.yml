version: '3.8'

services:
  kindle-sender:
    build: .
    container_name: kindle-article-sender
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - DEBUG=False
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
