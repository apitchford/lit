<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lit — Web to Kindle</title>
    <style>
        /* ── Tokens ── */
        :root {
            --bg:             #f7f6f2;
            --bg-raised:      #ffffff;
            --border:         #e0dcd4;
            --border-strong:  #c4c0b8;
            --text:           #111110;
            --text-2:         #55524e;
            --text-3:         #9c9890;
            --success-bg:     #f0f7f2;
            --success-text:   #1a4d2e;
            --success-border: #b8d8c4;
            --error-bg:       #fdf2f2;
            --error-text:     #6b1c1c;
            --error-border:   #e8b8b8;
            --warning-bg:     #fdf8ed;
            --warning-text:   #5c4000;
            --warning-border: #e8d898;
            --radius:         4px;
            --serif:          Georgia, 'Times New Roman', serif;
            --sans:           -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
        }

        [data-theme="dark"] {
            --bg:             #111110;
            --bg-raised:      #1c1c1a;
            --border:         #2e2e2a;
            --border-strong:  #484844;
            --text:           #f0ede6;
            --text-2:         #a09c94;
            --text-3:         #68645c;
            --success-bg:     #0d1f12;
            --success-text:   #7ecb9a;
            --success-border: #1c3d28;
            --error-bg:       #1f0f0f;
            --error-text:     #e09090;
            --error-border:   #3d1c1c;
            --warning-bg:     #1c1800;
            --warning-text:   #d4b060;
            --warning-border: #3a2e00;
        }

        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            transition: background 0.25s, color 0.25s;
        }

        /* ── Page layout ── */
        .page {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 28px 80px;
        }

        /* ── Header ── */
        .site-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 44px 0 18px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 36px;
        }

        .site-title {
            font-family: var(--serif);
            font-size: 2.8em;
            font-weight: normal;
            letter-spacing: -0.02em;
            line-height: 1;
        }

        .site-subtitle {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 6px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-3);
            cursor: pointer;
            font-size: 12px;
            font-family: var(--sans);
            padding: 6px 12px;
            border-radius: var(--radius);
            transition: border-color 0.15s, color 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
            margin-bottom: 4px;
            letter-spacing: 0.03em;
        }
        .theme-toggle:hover { border-color: var(--border-strong); color: var(--text-2); }

        /* ── Form elements ── */
        .form-group { margin-bottom: 22px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="email"],
        input[type="url"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            font-family: var(--sans);
            background: var(--bg-raised);
            color: var(--text);
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }
        input:focus       { outline: none; border-color: var(--border-strong); }
        input::placeholder{ color: var(--text-3); }

        .help-text {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 5px;
        }

        /* ── URL list ── */
        .url-list { display: flex; flex-direction: column; gap: 8px; }

        /* New rows animate in */
        @keyframes rowIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .url-row {
            display: flex;
            gap: 6px;
            align-items: flex-start;
            animation: rowIn 0.22s ease;
        }
        .url-row.drag-over { outline: 1px dashed var(--border-strong); border-radius: var(--radius); }
        .url-row.dragging  { opacity: 0.35; }

        /* Drag handle fades in when list has 2+ items */
        .drag-handle {
            cursor: grab;
            color: var(--text-3);
            font-size: 13px;
            padding: 9px 2px 0;
            flex-shrink: 0;
            user-select: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .drag-handle:active { cursor: grabbing; }
        .url-list.multi .drag-handle {
            opacity: 0.45;
            pointer-events: auto;
        }

        .url-row-inner { flex: 1; }

        /* Remove button fades in when list has 2+ items */
        .remove-btn {
            flex-shrink: 0;
            width: 28px; height: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-3);
            font-size: 15px;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, opacity 0.3s;
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }
        .remove-btn:hover { border-color: var(--border-strong); color: var(--text); }
        .url-list.multi .remove-btn {
            opacity: 1;
            pointer-events: auto;
        }

        /* Inline preview under each URL */
        .url-preview {
            margin-top: 5px;
            padding: 7px 10px;
            border-radius: var(--radius);
            background: var(--bg-raised);
            border: 1px solid var(--border);
            font-size: 12px;
            display: none;
        }
        .url-preview.active       { display: block; }
        .url-preview.loading-state{ display: block; color: var(--text-3); font-style: italic; }
        .url-preview.error-state  { display: block; color: var(--text-3); }

        .up-title { font-family: var(--serif); font-weight: normal; color: var(--text); line-height: 1.3; }
        .up-meta  { color: var(--text-3); margin-top: 2px; font-size: 11px; }

        /* ── List footer: add button + count ── */
        .list-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .btn-add {
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 13px;
            font-family: var(--sans);
            cursor: pointer;
            padding: 4px 0;
            transition: color 0.15s;
            letter-spacing: 0.01em;
        }
        .btn-add:hover { color: var(--text-2); }

        .url-count {
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: 0.04em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .url-count.visible { opacity: 1; }

        /* ── RSS section ── */
        .rss-section { margin-top: 14px; margin-bottom: 0; }

        .btn-link {
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 12px;
            font-family: var(--sans);
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-color: var(--border-strong);
            transition: color 0.15s;
        }
        .btn-link:hover { color: var(--text-2); }

        .rss-panel {
            margin-top: 10px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-raised);
            /* Animated open */
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.25s ease,
                        margin-top 0.35s ease;
            margin-top: 0;
            pointer-events: none;
        }
        .rss-panel.open {
            max-height: 400px;
            opacity: 1;
            margin-top: 10px;
            pointer-events: auto;
        }

        .rss-input-row { display: flex; gap: 8px; }
        .rss-input-row input { flex: 1; }
        #feedResults { margin-top: 12px; }

        .feed-article-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .feed-article-item:last-child { border-bottom: none; }
        .feed-article-item input[type="checkbox"] { margin-top: 2px; flex-shrink: 0; accent-color: var(--text); }
        .feed-article-title { font-family: var(--serif); font-weight: normal; color: var(--text); line-height: 1.3; }
        .feed-article-date  { color: var(--text-3); font-size: 11px; margin-top: 3px; letter-spacing: 0.02em; }
        .feed-add-row { margin-top: 12px; display: flex; justify-content: flex-end; }

        /* ── Title group — slides in at 2+ articles ── */
        .title-group {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1),
                        opacity 0.3s ease,
                        margin-top 0.4s ease;
            pointer-events: none;
        }
        .title-group.visible {
            max-height: 110px;
            opacity: 1;
            margin-top: 24px;
            pointer-events: auto;
        }

        /* ── Divider ── */
        .form-divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 28px 0;
        }

        /* ── Buttons ── */
        .btn-row { display: flex; gap: 8px; }

        .btn {
            flex: 1;
            padding: 10px 16px;
            background: var(--text);
            color: var(--bg);
            border: 1px solid var(--text);
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--sans);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.15s;
            white-space: nowrap;
            overflow: hidden;
        }
        .btn:hover:not(:disabled) { opacity: 0.78; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Button text fade on change */
        .btn.label-changing { opacity: 0; }

        .btn-outline {
            flex: 1;
            padding: 10px 16px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--sans);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.15s, opacity 0.15s;
        }
        .btn-outline:hover:not(:disabled) { border-color: var(--text); }
        .btn-outline:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-sm {
            padding: 6px 11px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--sans);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--bg-raised);
            color: var(--text-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s;
            white-space: nowrap;
        }
        .btn-sm:hover { border-color: var(--border-strong); color: var(--text); }

        /* ── Loading ── */
        .loading {
            display: none;
            align-items: center;
            gap: 10px;
            margin-top: 16px;
            color: var(--text-3);
            font-size: 12px;
        }
        .loading.active { display: flex; }

        .spinner {
            width: 14px; height: 14px;
            border: 1.5px solid var(--border);
            border-top-color: var(--text-3);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Status ── */
        .status {
            margin-top: 16px;
            padding: 11px 14px;
            border-radius: var(--radius);
            border: 1px solid;
            display: none;
            font-size: 13px;
            line-height: 1.55;
        }
        .status.active  { display: block; }
        .status.success { background: var(--success-bg); color: var(--success-text); border-color: var(--success-border); }
        .status.error   { background: var(--error-bg);   color: var(--error-text);   border-color: var(--error-border); }
        .status.warning { background: var(--warning-bg); color: var(--warning-text); border-color: var(--warning-border); }

        /* ── Compile progress list ── */
        .progress-list {
            margin-top: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 13px;
        }
        .progress-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-raised);
        }
        .progress-item:last-child { border-bottom: none; }

        .pi-icon   { font-size: 12px; flex-shrink: 0; margin-top: 1px; color: var(--text-3); }
        .pi-body   { flex: 1; min-width: 0; }
        .pi-url    { font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pi-title  { font-family: var(--serif); font-weight: normal; color: var(--text); margin-top: 2px; line-height: 1.3; }
        .pi-status { font-size: 11px; color: var(--text-3); font-style: italic; margin-top: 2px; }
        .pi-error  { font-size: 11px; color: var(--error-text); margin-top: 2px; }

        .progress-item.done   { background: var(--success-bg); }
        .progress-item.done   .pi-icon { color: var(--success-text); }
        .progress-item.failed { background: var(--error-bg); }
        .progress-item.failed .pi-icon { color: var(--error-text); }

        .compile-step-msg {
            padding: 9px 14px;
            background: var(--bg);
            color: var(--text-3);
            font-size: 12px;
            font-style: italic;
            border-top: 1px solid var(--border);
        }

        /* ── Footer ── */
        .site-footer {
            margin-top: 52px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        .about-toggle {
            background: none;
            border: none;
            color: var(--text-3);
            font-size: 11px;
            font-family: var(--sans);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0;
            transition: color 0.15s;
        }
        .about-toggle:hover { color: var(--text-2); }

        .about-panel {
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease;
        }
        .about-panel.open { max-height: 200px; opacity: 1; }

        .about-byline {
            font-size: 12px;
            color: var(--text-3);
            padding: 16px 0 12px;
        }

        .about-panel ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px 24px;
        }
        .about-panel li {
            font-size: 12px;
            color: var(--text-3);
            padding-left: 14px;
            position: relative;
        }
        .about-panel li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: var(--border-strong);
        }
    </style>
</head>
<body>
<div class="page">

    <!-- ── Header ── -->
    <header class="site-header">
        <div>
            <h1 class="site-title">Lit</h1>
            <p class="site-subtitle">Web to Kindle</p>
        </div>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">Dark mode</button>
    </header>

    <!-- ── Main form ── -->
    <form id="mainForm" autocomplete="off">

        <!-- URL list -->
        <div class="url-list" id="urlList"></div>

        <div class="list-footer">
            <button type="button" class="btn-add" id="addBtn" onclick="addUrlRow()">
                + Add another article
            </button>
            <span class="url-count" id="urlCount"></span>
        </div>

        <!-- RSS (animated open) -->
        <div class="rss-section">
            <button type="button" class="btn-link" onclick="toggleRss()">
                + Load from RSS / Substack feed
            </button>
            <div class="rss-panel" id="rssPanel">
                <div class="rss-input-row">
                    <input type="url" id="rssUrl" placeholder="https://example.substack.com/feed">
                    <button type="button" class="btn-sm" onclick="loadFeed()">Load Feed</button>
                </div>
                <div id="feedResults"></div>
            </div>
        </div>

        <!-- Compilation title — slides in at 2+ articles -->
        <div class="title-group" id="titleGroup">
            <div class="form-group" style="margin-bottom:0">
                <label for="c-title">Compilation Title</label>
                <input type="text" id="c-title"
                       placeholder="e.g. Morning Digest – 19 March">
                <p class="help-text">Leave blank to auto-generate from today's date</p>
            </div>
        </div>

        <hr class="form-divider">

        <div class="form-group" style="margin-bottom:20px">
            <label for="s-email">Kindle Email</label>
            <input type="email" id="s-email"
                   placeholder="username@kindle.com"
                   value="{{ kindle_email }}" required>
        </div>

        <div class="btn-row">
            <button type="submit" class="btn" id="sendBtn">Send to Kindle</button>
            <button type="button" class="btn-outline" id="dlBtn">Download EPUB</button>
        </div>

    </form>

    <!-- Compile progress (streaming) -->
    <div class="progress-list" id="progressList" style="display:none"></div>

    <!-- Loading spinner (single article) -->
    <div class="loading" id="mainLoading">
        <div class="spinner"></div>
        <span id="loadingText">Processing…</span>
    </div>

    <div class="status" id="mainStatus"></div>

    <!-- ── Footer ── -->
    <footer class="site-footer">
        <button class="about-toggle" id="aboutToggleBtn" onclick="toggleAbout()">
            About Lit ↓
        </button>
        <div class="about-panel" id="aboutPanel">
            <p class="about-byline">Developed by Art Pitchford</p>
            <ul>
                <li>Bypasses most paywalls</li>
                <li>Images in original positions</li>
                <li>Compile articles into a digest</li>
                <li>RSS &amp; Substack feed support</li>
                <li>Download as EPUB</li>
                <li>Light &amp; dark mode</li>
            </ul>
        </div>
    </footer>

</div>
<script>
// ════════════════════════════════════════════════════
// Theme
// ════════════════════════════════════════════════════

function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').textContent =
        theme === 'dark' ? 'Light mode' : 'Dark mode';
    localStorage.setItem('lit-theme', theme);
}

function toggleTheme() {
    applyTheme(
        document.documentElement.getAttribute('data-theme') === 'dark'
            ? 'light' : 'dark'
    );
}

(function initTheme() {
    const saved = localStorage.getItem('lit-theme');
    if (saved) { applyTheme(saved); return; }
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
})();

// ════════════════════════════════════════════════════
// About panel
// ════════════════════════════════════════════════════

function toggleAbout() {
    const open = document.getElementById('aboutPanel').classList.toggle('open');
    document.getElementById('aboutToggleBtn').textContent =
        open ? 'About Lit ↑' : 'About Lit ↓';
}

// ════════════════════════════════════════════════════
// URL list
// ════════════════════════════════════════════════════

let dragSrc = null;

function makeUrlRow(initialUrl = '') {
    const row     = document.createElement('div');
    row.className = 'url-row';
    row.draggable = true;
    row.innerHTML = `
        <span class="drag-handle" title="Drag to reorder">&#x2630;</span>
        <div class="url-row-inner">
            <input type="url" placeholder="https://example.com/article"
                   value="${initialUrl.replace(/"/g, '&quot;')}">
            <div class="url-preview"></div>
        </div>
        <button type="button" class="remove-btn" onclick="removeUrlRow(this)"
                title="Remove">&#x2212;</button>`;

    const input   = row.querySelector('input');
    const preview = row.querySelector('.url-preview');

    // Split multi-line paste into multiple rows
    input.addEventListener('paste', (e) => {
        const text  = e.clipboardData.getData('text');
        const lines = text.split(/[\n\r]+/).map(l => l.trim())
                          .filter(l => l.startsWith('http'));
        if (lines.length > 1) {
            e.preventDefault();
            input.value = lines[0];
            lines.slice(1).forEach(u => addUrlRow(u));
            fetchUrlPreview(input, preview);
        }
    });

    // Auto-preview on input
    let previewTimer = null;
    input.addEventListener('input', () => {
        clearTimeout(previewTimer);
        if (!input.value.trim()) { preview.className = 'url-preview'; return; }
        previewTimer = setTimeout(() => fetchUrlPreview(input, preview), 800);
    });

    // Drag and drop
    row.addEventListener('dragstart', (e) => {
        dragSrc = row;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => row.classList.add('dragging'), 0);
    });
    row.addEventListener('dragend',  () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave',() => row.classList.remove('drag-over'));
    row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        if (dragSrc && dragSrc !== row) {
            const list = document.getElementById('urlList');
            const rows = [...list.querySelectorAll('.url-row')];
            const si   = rows.indexOf(dragSrc), ti = rows.indexOf(row);
            list.insertBefore(dragSrc, si < ti ? row.nextSibling : row);
            updateListState();
        }
    });

    if (initialUrl) fetchUrlPreview(input, preview);
    return row;
}

async function fetchUrlPreview(input, preview) {
    const url = input.value.trim();
    if (!url) return;
    preview.className   = 'url-preview loading-state';
    preview.textContent = 'Fetching preview…';
    try {
        const res  = await fetch('/preview', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ url })
        });
        const data = await res.json();
        if (res.ok) {
            preview.className = 'url-preview active';
            preview.innerHTML = `
                <div class="up-title">${data.title}</div>
                <div class="up-meta">${[data.author, data.reading_time].filter(Boolean).join(' · ')}</div>`;
        } else {
            preview.className   = 'url-preview error-state';
            preview.textContent = 'Could not preview this URL.';
        }
    } catch {
        preview.className   = 'url-preview error-state';
        preview.textContent = 'Could not preview this URL.';
    }
}

function addUrlRow(url = '') {
    const list = document.getElementById('urlList');
    if (list.querySelectorAll('.url-row').length >= 20) {
        alert('Maximum 20 articles per compilation.'); return;
    }
    list.appendChild(makeUrlRow(url));
    updateListState();
    if (!url) list.lastElementChild.querySelector('input').focus();
}

function removeUrlRow(btn) {
    btn.closest('.url-row').remove();
    updateListState();
}

function getUrls() {
    return [...document.querySelectorAll('#urlList .url-row input')]
        .map(i => i.value.trim()).filter(Boolean);
}

// Central state update — drives all reactive UI
function updateListState() {
    const list  = document.getElementById('urlList');
    const rows  = list.querySelectorAll('.url-row');
    const count = rows.length;
    const multi = count >= 2;

    // Multi-item styles (drag handles, remove buttons)
    list.classList.toggle('multi', multi);

    // Title group slide-in
    document.getElementById('titleGroup').classList.toggle('visible', multi);

    // Article count badge
    const badge = document.getElementById('urlCount');
    badge.textContent = multi ? `${count} articles` : '';
    badge.classList.toggle('visible', multi);

    // Button label cross-fade
    const sendBtn  = document.getElementById('sendBtn');
    const newLabel = multi ? 'Compile & Send to Kindle' : 'Send to Kindle';
    if (sendBtn.textContent !== newLabel) {
        sendBtn.classList.add('label-changing');
        setTimeout(() => {
            sendBtn.textContent = newLabel;
            sendBtn.classList.remove('label-changing');
        }, 150);
    }
}

// Start with one row
addUrlRow();
// Override the animation on the first row (no entrance needed)
document.querySelector('.url-row').style.animation = 'none';

// ════════════════════════════════════════════════════
// RSS feed loader
// ════════════════════════════════════════════════════

function toggleRss() {
    document.getElementById('rssPanel').classList.toggle('open');
}

async function loadFeed() {
    const url     = document.getElementById('rssUrl').value.trim();
    const results = document.getElementById('feedResults');
    if (!url) return;
    results.innerHTML = '<em style="font-size:12px;color:var(--text-3)">Loading feed…</em>';
    try {
        const res  = await fetch('/fetch-feed', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ url })
        });
        const data = await res.json();
        if (!res.ok) {
            results.innerHTML = `<p style="color:var(--error-text);font-size:12px">${data.error}</p>`;
            return;
        }
        results.innerHTML = data.articles.map((a, i) => `
            <div class="feed-article-item">
                <input type="checkbox" id="feed-${i}" value="${a.url}" checked>
                <label for="feed-${i}">
                    <div class="feed-article-title">${a.title || a.url}</div>
                    <div class="feed-article-date">${a.date || ''}</div>
                </label>
            </div>`).join('') + `
            <div class="feed-add-row">
                <button type="button" class="btn-sm" onclick="addFeedArticles()">
                    Add selected to list
                </button>
            </div>`;
    } catch (err) {
        results.innerHTML = `<p style="color:var(--error-text);font-size:12px">${err.message}</p>`;
    }
}

function addFeedArticles() {
    [...document.querySelectorAll('#feedResults input[type=checkbox]:checked')]
        .forEach(cb => addUrlRow(cb.value));
    document.getElementById('rssPanel').classList.remove('open');
    document.getElementById('feedResults').innerHTML = '';
    document.getElementById('rssUrl').value          = '';
}

// ════════════════════════════════════════════════════
// Form submission
// ════════════════════════════════════════════════════

document.getElementById('mainForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    await run('send');
});

document.getElementById('dlBtn').addEventListener('click', async () => {
    await run('download');
});

async function run(action) {
    const urls    = getUrls();
    const email   = document.getElementById('s-email').value.trim();
    const title   = document.getElementById('c-title').value.trim();
    const sendBtn = document.getElementById('sendBtn');
    const dlBtn   = document.getElementById('dlBtn');
    const loading = document.getElementById('mainLoading');
    const loadingText = document.getElementById('loadingText');
    const multi   = urls.length >= 2;

    if (!urls.length) {
        showStatus('error', '<strong>✗</strong> Please enter at least one URL.');
        return;
    }

    sendBtn.disabled = true;
    dlBtn.disabled   = true;
    clearStatus();

    // ── Download (single or compile) ──────────────────
    if (action === 'download') {
        loading.classList.add('active');
        loadingText.textContent = urls.length > 1
            ? `Generating EPUB for ${urls.length} articles…`
            : 'Generating EPUB…';
        try {
            const res = await fetch('/download', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ urls, title })
            });
            loading.classList.remove('active');
            if (res.ok) {
                const blob        = await res.blob();
                const disposition = res.headers.get('Content-Disposition') || '';
                const match       = disposition.match(/filename="?([^"]+)"?/);
                triggerDownload(blob, match ? match[1] : 'article.epub');
                showStatus('success', '<strong>✓ EPUB ready</strong> — download started.');
            } else {
                const data = await res.json();
                showStatus('error', `<strong>✗ Error:</strong> ${data.error}`);
            }
        } catch (err) {
            loading.classList.remove('active');
            showStatus('error', `<strong>✗ Error:</strong> ${err.message}`);
        } finally {
            sendBtn.disabled = false;
            dlBtn.disabled   = false;
        }
        return;
    }

    // ── Send — single article ─────────────────────────
    if (!multi) {
        const steps = ['Extracting content…','Processing images…','Generating EPUB…','Sending to Kindle…'];
        let stepIdx = 0;
        loading.classList.add('active');
        loadingText.textContent = steps[0];
        const interval = setInterval(() => {
            loadingText.textContent = steps[++stepIdx % steps.length];
        }, 3000);

        try {
            const res = await fetch('/process', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify({ url: urls[0], kindle_email: email })
            });
            clearInterval(interval);
            loading.classList.remove('active');
            const data = await res.json();
            if (res.ok) {
                saveEmail(email);
                showStatus('success', `
                    <strong>✓ Sent!</strong><br>
                    <strong>${data.title}</strong> → ${data.kindle_email}<br>
                    ${data.author ? `By ${data.author} · ` : ''}${data.images_count} image${data.images_count !== 1 ? 's' : ''} · ${data.file_size_mb} MB`);
                document.getElementById('urlList').querySelector('input').value = '';
                document.querySelector('.url-preview').className = 'url-preview';
            } else {
                showStatus('error', `<strong>✗ Error:</strong> ${data.error}`);
            }
        } catch (err) {
            clearInterval(interval);
            loading.classList.remove('active');
            showStatus('error', `<strong>✗ Error:</strong> ${err.message}`);
        } finally {
            sendBtn.disabled = false;
            dlBtn.disabled   = false;
        }
        return;
    }

    // ── Send — compile (streaming SSE) ───────────────
    const progressList  = document.getElementById('progressList');
    progressList.style.display = 'block';
    progressList.innerHTML     = '';
    const progressItems = {};

    try {
        const res     = await fetch('/compile', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body:    JSON.stringify({ urls, title, kindle_email: email })
        });
        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer    = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                let evt;
                try { evt = JSON.parse(line.slice(6)); } catch { continue; }
                handleCompileEvent(evt, progressList, progressItems, email);
            }
        }
    } catch (err) {
        showStatus('error', `<strong>✗ Error:</strong> ${err.message}`);
    } finally {
        sendBtn.disabled = false;
        dlBtn.disabled   = false;
    }
}

function handleCompileEvent(evt, progressList, progressItems, email) {
    const { type, step, index, url, title, reason, message } = evt;

    if (type === 'progress') {
        if (step === 'extracting') {
            const el = document.createElement('div');
            el.className = 'progress-item';
            el.innerHTML = `
                <span class="pi-icon">○</span>
                <div class="pi-body">
                    <div class="pi-url">${url}</div>
                    <div class="pi-status">Extracting…</div>
                </div>`;
            progressList.appendChild(el);
            progressItems[index] = el;

        } else if (step === 'images' && progressItems[index]) {
            progressItems[index].querySelector('.pi-status').textContent =
                `"${title}" — processing images…`;

        } else if (step === 'done' && progressItems[index]) {
            const el = progressItems[index];
            el.className = 'progress-item done';
            el.innerHTML = `
                <span class="pi-icon">✓</span>
                <div class="pi-body">
                    <div class="pi-title">${title}</div>
                    <div class="pi-url">${url}</div>
                </div>`;

        } else if (step === 'failed' && progressItems[index]) {
            const el = progressItems[index];
            el.className = 'progress-item failed';
            el.innerHTML = `
                <span class="pi-icon">✗</span>
                <div class="pi-body">
                    <div class="pi-url">${url}</div>
                    <div class="pi-error">${reason || 'Failed'}</div>
                </div>`;

        } else if (step === 'generating' || step === 'sending') {
            const existing = progressList.querySelector('.compile-step-msg');
            if (existing) existing.remove();
            const el = document.createElement('div');
            el.className   = 'compile-step-msg';
            el.textContent = message || (step === 'generating' ? 'Generating EPUB…' : 'Sending to Kindle…');
            progressList.appendChild(el);
        }

    } else if (type === 'complete') {
        const { articles_compiled, articles_failed, failed_urls, file_size_mb, kindle_email } = evt;
        const stepMsg = progressList.querySelector('.compile-step-msg');
        if (stepMsg) stepMsg.remove();
        saveEmail(email);

        let html = `<strong>✓ Sent!</strong> ${articles_compiled} article${articles_compiled !== 1 ? 's' : ''} compiled (${file_size_mb} MB) → ${kindle_email}`;
        let type = 'success';

        if (articles_failed > 0) {
            type = 'warning';
            const failList = failed_urls.map(f => `<li>${f.url} — ${f.reason}</li>`).join('');
            html += `<br><br><strong>${articles_failed} URL${articles_failed !== 1 ? 's' : ''} skipped:</strong><ul style="margin:6px 0 0 16px">${failList}</ul>`;
        }
        showStatus(type, html);

    } else if (type === 'error') {
        showStatus('error', `<strong>✗ Error:</strong> ${message}`);
    }
}

// ════════════════════════════════════════════════════
// Helpers
// ════════════════════════════════════════════════════

function showStatus(type, html) {
    const el = document.getElementById('mainStatus');
    el.className = `status active ${type}`;
    el.innerHTML = html;
}

function clearStatus() {
    const el = document.getElementById('mainStatus');
    el.className = 'status';
    el.innerHTML = '';
}

function saveEmail(email) {
    if (email) localStorage.setItem('kindleEmail', email);
}

function triggerDownload(blob, filename) {
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}

// Load saved Kindle email
(function loadSavedEmail() {
    const saved = localStorage.getItem('kindleEmail');
    if (!saved) return;
    const el = document.getElementById('s-email');
    if (el && !el.value) el.value = saved;
})();
</script>
